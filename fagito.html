<title>Δήλωση φαγητού</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf4f6;color:#512332;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:24px}main{width:100%;max-width:520px;background:#fff;border:1px solid #ead8de;border-radius:24px;padding:clamp(24px,6vw,44px);box-shadow:0 16px 50px #80244010}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:#80636d}h1{font-size:32px;line-height:1.15;margin:16px 0}p{line-height:1.6;color:#80636d}label{display:block;font-weight:650;margin:26px 0 9px}input,textarea,select{display:block;width:100%;border:1px solid #d5b5c0;border-radius:12px;background:#fffcfd;padding:14px;font:inherit;color:#512332}textarea{resize:vertical;min-height:116px}input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #b72552;outline-offset:3px}small{display:block;color:#80636d;margin-top:8px;line-height:1.5}button{margin-top:26px;width:100%;border:0;border-radius:12px;padding:16px;background:#b72552;color:#fff;font:700 17px system-ui;cursor:pointer;min-height:54px}button:hover{background:#941b43}button:disabled{opacity:.65;cursor:wait}.note{font-size:13px;margin:20px 0 0}.status{color:#9b332b;font-size:14px;margin:14px 0 0}.status:empty{display:none}

main{min-width:0;max-width:640px}
.brand{margin:0 0 28px;text-align:center}
.brand img{display:block;width:100%;max-width:440px;height:auto;margin:auto}
.table-scroll{max-width:100%;overflow-x:auto;border:1px solid #d5b5c0;border-radius:12px;margin-top:24px;overscroll-behavior-x:contain}
.table-scroll:focus-visible{outline:3px solid #b72552;outline-offset:3px}
.information-table{border-collapse:collapse;table-layout:fixed;width:100%;font-size:15px}
.information-table th,.information-table td{width:100%;padding:12px 14px;border-right:1px solid #ead8de;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.information-table th{background:#b72552;color:white;font-weight:650}
.information-table td{height:48px;background:#fffcfd;border-top:1px solid #ead8de;white-space:pre-wrap}
.information-table th:last-child,.information-table td:last-child{border-right:0}
@media(max-width:480px){body{padding:14px}main{padding:24px 18px;border-radius:18px}}

.food-choice{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0;min-height:48px;padding:8px 0;cursor:pointer;font-weight:500}
.food-choice span{white-space:normal;overflow-wrap:anywhere}
.food-choice input{display:block;flex:0 0 22px;width:22px;height:22px;margin:0;padding:0;accent-color:#b72552;cursor:pointer}
.information-table td{padding:4px 14px}
.information-table tr:has(input:checked) td{background:#f9e6ed}

/* Το λογότυπο και η οδηγία παραμένουν ορατά κατά την κύλιση. */
.brand{position:sticky;top:0;z-index:10;background:#fff;padding:12px 0 14px;border-bottom:1px solid #ead8de}
.brand img{max-width:320px;max-height:110px;object-fit:contain}
.form-instructions{margin:12px 0 0;color:#b72552;font-size:14px;line-height:1.5;text-align:center}
html{scroll-padding-top:210px}
@media(max-width:480px){.brand img{max-width:240px;max-height:83px}.form-instructions{font-size:12px}.brand{padding-top:8px;padding-bottom:10px}}
</style>

<input type="hidden" name="food" id="combined-food">

</main>
<script>
// ΜΟΝΗ ΡΥΘΜΙΣΗ: Αντικατάστησε το παρακάτω με το URL του Apps Script που τελειώνει σε /exec.
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykpe1MVM_H2IvBAfzfqQmwhlcMBEnMtAvlTgaEdHfdz1EQw8cn18hJdJTcZP64-rmn/exec";
const form = document.getElementById('food-form');
const button = document.getElementById('submit-button');
const status = document.getElementById('status');
const fullName = document.getElementById('full-name');
const requestId = document.getElementById('request-id');
function resetSubmission() {
  button.disabled = false;
  button.textContent = 'Επικύρωση';
  status.textContent = '';
  requestId.value = crypto.randomUUID();
}
window.addEventListener('pageshow', resetSubmission);
fullName.addEventListener('input', () => fullName.setCustomValidity(''));
form.addEventListener('submit', event => {
  fullName.value = fullName.value.trim();
  if (!fullName.value) {
    event.preventDefault();
    fullName.setCustomValidity('Επίλεξε το ονοματεπώνυμό σου από τη λίστα.');
    fullName.reportValidity();
    return;
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(GOOGLE_SCRIPT_URL)) {
    event.preventDefault();
    status.textContent = 'Η φόρμα δεν έχει συνδεθεί ακόμη. Ο διοργανωτής πρέπει να προσθέσει τη διεύθυνση του Google Apps Script.';
    return;
  }
  const selectedFoods = Array.from(form.querySelectorAll('.food-checkbox:checked'))
    .map(checkbox => checkbox.closest('label').querySelector('span').textContent.trim());
  const extraFood = document.getElementById('food').value.trim();
  if (extraFood) selectedFoods.push(extraFood);
  document.getElementById('combined-food').value = selectedFoods.join(' - ');
  if (!requestId.value) requestId.value = crypto.randomUUID();
  form.action = GOOGLE_SCRIPT_URL;
  button.disabled = true;
  button.textContent = 'Αποστολή…';
  // Κανονική υποβολή POST. Η Google εμφανίζει την επιβεβαίωση ΜΟΝΟ μετά την εγγραφή.
  // Δεν χρησιμοποιούμε fetch/no-cors, που δεν μπορεί να επιβεβαιώσει την αποθήκευση.
});
</script>
